<div class="min-h-screen flex items-center justify-center bg-whatsapp-dark login-background">
  <!-- Subtle gradient overlay -->
  <div class="absolute inset-0 bg-gradient-to-br from-whatsapp-dark via-whatsapp-gray to-whatsapp-dark opacity-50"></div>

  <div class="relative bg-whatsapp-gray p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
    <!-- Logo/Icon Section -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center mb-4">
        <img
          src="assets/images/logo-whatsapp-bot.png"
          alt="WhatsApp Bot Logo"
          class="h-24 object-contain"
        />
      </div>
      <h1 class="text-3xl font-bold text-gray-100 mb-2">{{ 'auth.login' | translate }}</h1>
      <p class="text-gray-400 text-sm">WhatsApp CRM Agent Portal</p>
    </div>

    <form (ngSubmit)="login()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">
          <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          {{ 'auth.email' | translate }}
        </label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
          class="w-full px-4 py-3 bg-whatsapp-input border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-whatsapp-green focus:border-transparent text-gray-100 placeholder-gray-500 transition-all"
          placeholder="agent@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">
          <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          {{ 'auth.password' | translate }}
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
          class="w-full px-4 py-3 bg-whatsapp-input border border-gray-600 rounded-lg focus:outline-none focus:ring-2 focus:ring-whatsapp-green focus:border-transparent text-gray-100 placeholder-gray-500 transition-all"
          placeholder="••••••••"
        />
      </div>

      <div *ngIf="error" class="text-red-400 text-sm bg-red-900/30 border border-red-800 p-3 rounded-lg flex items-start gap-2">
        <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
        </svg>
        <span>{{ error }}</span>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-whatsapp-green text-white py-3 px-4 rounded-lg hover:bg-opacity-90 disabled:bg-gray-600 disabled:cursor-not-allowed transition-all font-medium shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 active:translate-y-0"
      >
        <span *ngIf="!loading" class="flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          {{ 'auth.loginButton' | translate }}
        </span>
        <span *ngIf="loading" class="flex items-center justify-center gap-2">
          <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ 'auth.loggingIn' | translate }}
        </span>
      </button>
    </form>
  </div>
</div>
